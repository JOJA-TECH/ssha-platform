name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_ROOT: terraform/environments/prod
  AZURE_LOCATION: eastus

permissions:
  id-token: write   # OIDC
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.15.9"

      # D1: estos chequeos no requieren credenciales de Azure ni tfvars locales.
      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_ROOT }}

      - name: Terraform Init (no backend, validate-only)
        run: terraform init -backend=false
        working-directory: ${{ env.TF_ROOT }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_ROOT }}

      - name: Checkov (blocking)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TF_ROOT }}
          framework: terraform
          # Checkov falla el pipeline ante cualquier hallazgo (D1).

  apply:
    runs-on: ubuntu-latest
    # Opt-in explícito: un push a main no despliega sin variables y secrets configurados.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_AZURE_APPLY == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.15.9"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap backend remoto
        run: |
          az group create --name "${{ secrets.TF_STATE_RG }}" --location "${{ env.AZURE_LOCATION }}" >/dev/null || true
          az storage account create \
            --name "${{ secrets.TF_STATE_STORAGE }}" \
            --resource-group "${{ secrets.TF_STATE_RG }}" \
            --location "${{ env.AZURE_LOCATION }}" \
            --sku Standard_LRS --kind StorageV2 --https-only true >/dev/null || true
          az storage container create \
            --account-name "${{ secrets.TF_STATE_STORAGE }}" \
            --name tfstate --auth-mode login >/dev/null || true

      - name: Terraform Init
        run: terraform init -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE }}"
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_state_resource_group: ${{ secrets.TF_STATE_RG }}
          TF_VAR_state_container: tfstate

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_state_resource_group: ${{ secrets.TF_STATE_RG }}
          TF_VAR_state_storage_account: ${{ secrets.TF_STATE_STORAGE }}
          TF_VAR_state_container: tfstate

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_ROOT }}
